<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D3E97A"/>
      <stop offset="100%" stop-color="#9BC02D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#D3E97A" stroke-width="4.5" stroke-opacity="0.85" />

  <!-- Cyber Status Accent Dot -->
  <circle cx="102" cy="26" r="5" fill="#D3E97A" filter="url(#glow)" />

  <!-- VC Geometric Monogram -->
  <!-- 'V' in Neon Cyber-Lime -->
  <path d="M 22 38 L 42 90 L 52 90 L 72 38 L 59 38 L 47 73 L 35 38 Z" fill="url(#brand)" />

  <!-- 'C' in Crisp White with Depth -->
  <path d="M 104 53 C 100 43 91 38 80 38 C 65 38 56 50 56 64 C 56 78 65 90 80 90 C 91 90 100 85 104 75 L 92 75 C 90 79 86 82 80 82 C 71 82 66 73 66 64 C 66 55 71 46 80 46 C 86 46 90 49 92 53 Z" fill="#FFFFFF" />
</svg>
